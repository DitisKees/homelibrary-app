name: Generate dependency lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Update Expo patch dependencies and pin Expo Doctor
        run: |
          npm install --package-lock-only --ignore-scripts             expo@~57.0.24             expo-image-manipulator@~57.0.19             expo-image-picker@~57.0.19
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact expo-doctor@1.20.4

      - name: Upload generated dependency files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-lock
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
