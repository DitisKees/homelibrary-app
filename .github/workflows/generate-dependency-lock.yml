name: Generate dependency lock

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Update Expo patch dependencies and pin Expo Doctor
        run: |
          npm install --package-lock-only --ignore-scripts \
            expo@~57.0.24 \
            expo-image-manipulator@~57.0.19 \
            expo-image-picker@~57.0.19
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact expo-doctor@1.20.4

      - name: Commit generated dependency files
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Update Expo patch dependencies and pin Expo Doctor"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
