name: Bump v1.0.1

on:
  push:
    branches:
      - fix-pocketbase-timestamps
    paths:
      - '.github/workflows/bump-v1.0.1.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-pocketbase-timestamps

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Bump release metadata
        shell: bash
        run: |
          set -euo pipefail
          npm version 1.0.1 --no-git-tag-version --ignore-scripts
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          app.expo.version = '1.0.1';
          app.expo.android.versionCode = 2;
          fs.writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');
          NODE
          sed -i 's/such as 1\.0\.0/such as 1.0.1/g' compose.example.yml
          sed -i 's/Version tags such as `v1\.0\.0` publish semantic aliases (`1\.0\.0`, `1\.0`, `1`)/Version tags such as `v1.0.1` publish semantic aliases (`1.0.1`, `1.0`, `1`)/' docs/self-hosting.md
          sed -i 's/HOMELIBRARY_VERSION=1\.0\.0/HOMELIBRARY_VERSION=1.0.1/' docs/self-hosting.md

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json app.json compose.example.yml docs/self-hosting.md
          git commit -m 'Bump version to 1.0.1'
          git push origin HEAD:fix-pocketbase-timestamps
