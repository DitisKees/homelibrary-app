name: Docker self-hosting

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PB_VERSION: '0.40.1'

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  validate:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Docker self-hosting stack
        run: bash scripts/test-docker-selfhost.sh

  build-and-publish:
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [backend, web]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches application version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          app_version="$(node -p "require('./app.json').expo.version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version}" != "${app_version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app.json Expo version ${app_version}." >&2
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/ditiskees/homelibrary-${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{major}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      # PRs validate the same multi-architecture build that pushes publish.
      - name: Build image and publish on push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          build-args: |
            PB_VERSION=${{ env.PB_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=homelibrary-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=homelibrary-${{ matrix.image }}

  docker-gate:
    name: Docker self-hosting gate
    if: always()
    needs: [changes, validate, build-and-publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check relevant job results
        env:
          DETECTION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.docker }}
          VALIDATION: ${{ needs.validate.result }}
          BUILD: ${{ needs.build-and-publish.result }}
        run: |
          test "$DETECTION" = success
          test "$REQUIRED" = true || test "$REQUIRED" = false
          if [ "$REQUIRED" = true ]; then
            test "$VALIDATION" = success
            test "$BUILD" = success
          fi
