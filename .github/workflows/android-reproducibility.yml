name: Android reproducibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-reproducibility.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  reproducible-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository twice
        uses: actions/checkout@v4
        with:
          path: source-a

      - name: Check out identical commit again
        uses: actions/checkout@v4
        with:
          path: source-b

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Debian Node.js, npm and ELF diagnostics
        run: |
          sudo apt-get update
          sudo apt-get install -y nodejs npm binutils
          node --version
          npm --version
          readelf --version | head -n 1

      - name: Build first unsigned APK
        working-directory: source-a
        run: |
          set -euo pipefail
          npm ci
          npm run validate:android-release
          npm run validate:fdroid-metadata
          bash scripts/prepare-fdroid-source-tree.sh
          npx expo prebuild --clean --no-install --platform android
          sed -i -e '/signingConfig /d' android/app/build.gradle
          bash scripts/check-fdroid-android-dependencies.sh
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Build second unsigned APK
        working-directory: source-b
        run: |
          set -euo pipefail
          npm ci
          npm run validate:android-release
          npm run validate:fdroid-metadata
          bash scripts/prepare-fdroid-source-tree.sh
          npx expo prebuild --clean --no-install --platform android
          sed -i -e '/signingConfig /d' android/app/build.gradle
          bash scripts/check-fdroid-android-dependencies.sh
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Compare APKs and diagnose differences
        run: |
          set -euo pipefail
          APK_A="source-a/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_B="source-b/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK_A"
          test -f "$APK_B"

          echo 'APK SHA-256:'
          sha256sum "$APK_A" "$APK_B"

          if cmp --silent "$APK_A" "$APK_B"; then
            echo 'Unsigned APKs are byte-for-byte identical.'
            exit 0
          fi

          echo 'Unsigned APKs differ. Generating per-entry diagnostics.' >&2
          rm -rf apk-a apk-b elf-diagnostics
          mkdir apk-a apk-b elf-diagnostics
          unzip -qq "$APK_A" -d apk-a
          unzip -qq "$APK_B" -d apk-b

          (
            cd apk-a
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > apk-a.sha256
          (
            cd apk-b
            find . -type f -print0 | sort -z | xargs -0 sha256sum
          ) > apk-b.sha256

          echo 'Files present in only one APK:'
          comm -3 \
            <(cd apk-a && find . -type f | sort) \
            <(cd apk-b && find . -type f | sort) || true

          echo 'Entries with different uncompressed contents:'
          diff -u apk-a.sha256 apk-b.sha256 || true

          echo 'ZIP entry metadata differences:'
          unzip -Z -v "$APK_A" > apk-a.zipinfo.txt
          unzip -Z -v "$APK_B" > apk-b.zipinfo.txt
          diff -u apk-a.zipinfo.txt apk-b.zipinfo.txt || true

          # Native libraries are currently the only differing APK entries. Inspect
          # representative ELF pairs for embedded checkout/build paths, build IDs,
          # section differences and other compiler/linker metadata.
          for rel in \
            lib/arm64-v8a/libappmodules.so \
            lib/arm64-v8a/libexpo-modules-core.so \
            lib/arm64-v8a/libgesturehandler.so \
            lib/arm64-v8a/libreact_codegen_rnscreens.so \
            lib/arm64-v8a/librnscreens.so
          do
            a="apk-a/$rel"
            b="apk-b/$rel"
            [[ -f "$a" && -f "$b" ]] || continue
            base="$(basename "$rel" .so)"

            echo "===== ELF diagnostic: $rel ====="
            sha256sum "$a" "$b"

            readelf -W -S "$a" > "elf-diagnostics/${base}-a.sections.txt"
            readelf -W -S "$b" > "elf-diagnostics/${base}-b.sections.txt"
            readelf -W -n "$a" > "elf-diagnostics/${base}-a.notes.txt" || true
            readelf -W -n "$b" > "elf-diagnostics/${base}-b.notes.txt" || true
            readelf -W -p .comment "$a" > "elf-diagnostics/${base}-a.comment.txt" 2>&1 || true
            readelf -W -p .comment "$b" > "elf-diagnostics/${base}-b.comment.txt" 2>&1 || true
            strings -a "$a" > "elf-diagnostics/${base}-a.strings.txt"
            strings -a "$b" > "elf-diagnostics/${base}-b.strings.txt"

            echo '-- section table diff --'
            diff -u "elf-diagnostics/${base}-a.sections.txt" "elf-diagnostics/${base}-b.sections.txt" || true
            echo '-- ELF notes/build-id diff --'
            diff -u "elf-diagnostics/${base}-a.notes.txt" "elf-diagnostics/${base}-b.notes.txt" || true
            echo '-- compiler comment diff --'
            diff -u "elf-diagnostics/${base}-a.comment.txt" "elf-diagnostics/${base}-b.comment.txt" || true
            echo '-- strings containing checkout/build paths --'
            grep -E 'source-[ab]|/home/runner|/_work/|node_modules|CMakeFiles|\.cxx/' "elf-diagnostics/${base}-a.strings.txt" | sort -u > "elf-diagnostics/${base}-a.paths.txt" || true
            grep -E 'source-[ab]|/home/runner|/_work/|node_modules|CMakeFiles|\.cxx/' "elf-diagnostics/${base}-b.strings.txt" | sort -u > "elf-diagnostics/${base}-b.paths.txt" || true
            diff -u "elf-diagnostics/${base}-a.paths.txt" "elf-diagnostics/${base}-b.paths.txt" || true
          done

          echo 'Diagnostic files have been written for the artifact upload.' >&2
          exit 1

      - name: Upload comparison APKs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reproducibility-apks-${{ github.sha }}
          path: |
            source-a/android/app/build/outputs/apk/release/*.apk
            source-b/android/app/build/outputs/apk/release/*.apk
            apk-a.sha256
            apk-b.sha256
            apk-a.zipinfo.txt
            apk-b.zipinfo.txt
            elf-diagnostics/**
          if-no-files-found: warn
          retention-days: 7
