name: F-Droid buildserver simulation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/fdroid-buildserver-simulation.yml'
      - '.fdroid.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'scripts/**'
      - 'src/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fdroid-buildserver-simulation.yml'
      - '.fdroid.yml'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'plugins/**'
      - 'scripts/**'
      - 'src/**'

permissions:
  contents: read

jobs:
  fdroid-buildserver:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
    timeout-minutes: 90
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      FDROID_SIMULATION_SOURCE_REF: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out HomeLibrary
        uses: actions/checkout@v4

      - name: Run F-Droid production-buildserver simulation
        run: bash scripts/run-fdroid-buildserver-simulation.sh "$FDROID_SIMULATION_SOURCE_REF"

      - name: Upload buildserver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-buildserver-diagnostics-${{ github.sha }}
          path: fdroid-buildserver-diagnostics/
          if-no-files-found: warn
          retention-days: 7
