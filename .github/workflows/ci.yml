name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit F-Droid npm dependencies
        run: npm run audit:fdroid-npm

      - name: Check deterministic app icons
        run: npm run check:fdroid-icons

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Validate Android release configuration
        run: npm run validate:android-release

      - name: Validate F-Droid metadata and recipe
        run: npm run validate:fdroid-metadata

      - name: Remove bundled Expo Android binaries
        run: bash scripts/prepare-fdroid-source-tree.sh

      - name: Prebuild clean Android native project
        run: npx expo prebuild --clean --no-install --platform android

      - name: Check F-Droid Android dependency graph
        run: bash scripts/check-fdroid-android-dependencies.sh

      - name: Build F-Droid-style release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify F-Droid-style release APK
        run: bash scripts/verify-fdroid-apk.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Export web app
        run: npm run build:web

  validate-pocketbase:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download PocketBase 0.40.1
        run: |
          curl -fsSL \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.1/pocketbase_0.40.1_linux_amd64.zip \
            -o /tmp/pocketbase.zip
          unzip -q /tmp/pocketbase.zip -d /tmp/pocketbase
          chmod +x /tmp/pocketbase/pocketbase

      - name: Validate PocketBase schema and book sorting
        run: bash scripts/test-pocketbase-schema.sh
