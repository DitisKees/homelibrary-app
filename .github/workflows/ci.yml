name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Validate Android release configuration
        run: npm run validate:android-release

      - name: Prebuild Android native project
        run: npx expo prebuild --no-install --platform android

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Export web app
        run: npm run build:web

  validate-pocketbase:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download PocketBase 0.40.1
        run: |
          curl -fsSL \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.1/pocketbase_0.40.1_linux_amd64.zip \
            -o /tmp/pocketbase.zip
          unzip -q /tmp/pocketbase.zip -d /tmp/pocketbase
          chmod +x /tmp/pocketbase/pocketbase

      - name: Apply PocketBase migrations to a fresh database
        run: |
          /tmp/pocketbase/pocketbase migrate up \
            --dir "${RUNNER_TEMP}/homelibrary-pb-data" \
            --migrationsDir "${GITHUB_WORKSPACE}/pocketbase/pb_migrations"
