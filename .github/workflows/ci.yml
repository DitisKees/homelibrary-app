name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  source-checks:
    needs: changes
    if: needs.changes.outputs.source == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check reproducible Gradle configuration
        run: node --test scripts/test-reproducible-gradle.mjs scripts/test-android-release-packaging.mjs

      - name: Check ABI APK verification
        run: python3 scripts/test-verify-android-abi-apk.py

      - name: Check Android startup verification
        run: python3 scripts/test-android-startup.py

      - name: Check reviewed Expo Camera source patch
        run: node --test scripts/test-expo-camera-patch.mjs

      - name: Audit F-Droid npm dependencies
        run: npm run audit:fdroid-npm

      - name: Check deterministic app icons
        run: npm run check:fdroid-icons

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Validate Android release configuration
        run: npm run validate:android-release

      - name: Validate F-Droid metadata and recipe
        run: npm run validate:fdroid-metadata

      # Native builds, dependency checks, APK scanning and startup checks run
      # in fdroid-buildserver-simulation.yml using the production toolchain.

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Export web app
        run: npm run build:web

  pocketbase-checks:
    needs: changes
    if: needs.changes.outputs.pocketbase == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download PocketBase 0.40.1
        run: |
          curl -fsSL \
            https://github.com/pocketbase/pocketbase/releases/download/v0.40.1/pocketbase_0.40.1_linux_amd64.zip \
            -o /tmp/pocketbase.zip
          unzip -q /tmp/pocketbase.zip -d /tmp/pocketbase
          chmod +x /tmp/pocketbase/pocketbase

      - name: Validate PocketBase schema and book sorting
        run: bash scripts/test-pocketbase-schema.sh

  validate:
    if: always()
    needs: [changes, source-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check relevant job results
        env:
          DETECTION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.source }}
          CHECKS: ${{ needs.source-checks.result }}
        run: |
          test "$DETECTION" = success
          test "$REQUIRED" = true || test "$REQUIRED" = false
          if [ "$REQUIRED" = true ]; then
            test "$CHECKS" = success
          fi

  validate-pocketbase:
    if: always()
    needs: [changes, pocketbase-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Check relevant job results
        env:
          DETECTION: ${{ needs.changes.result }}
          REQUIRED: ${{ needs.changes.outputs.pocketbase }}
          CHECKS: ${{ needs.pocketbase-checks.result }}
        run: |
          test "$DETECTION" = success
          test "$REQUIRED" = true || test "$REQUIRED" = false
          if [ "$REQUIRED" = true ]; then
            test "$CHECKS" = success
          fi
