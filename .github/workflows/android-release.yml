name: Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable vX.Y.Z tag to build and publish; leave blank for a verification-only manual build'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-fdroid-unsigned:
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:9cb68105642ca4e7b295f0ceab10f069f5b3247dc18fa7c36046e9d81aa469a8
    timeout-minutes: 90
    env:
      FDROID_ABI: ${{ matrix.abi }}
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      FDROID_EXPORT_APK: fdroid-buildserver-output/app-release-unsigned.apk

    steps:
      - name: Check out release harness
        uses: actions/checkout@v4
        with:
          # Recovery uses current main harness tooling. F-Droid itself is given
          # the immutable tag SHA resolved below.
          ref: ${{ inputs.release_tag && github.sha || github.ref }}

      - name: Validate immutable release source
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          HARNESS_VERSION="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["version"])')"
          HARNESS_VERSION_CODE="$(python3 -c 'import json; print(json.load(open("app.json"))["expo"]["android"]["versionCode"])')"
          RELEASE_TAG=""

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${REQUESTED_RELEASE_TAG:-}" ]; then
            RELEASE_TAG="${REQUESTED_RELEASE_TAG}"
          fi

          if [ -n "${RELEASE_TAG}" ]; then
            git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            SOURCE_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            TAG_APP_JSON="$(git show "${RELEASE_TAG}:app.json")"
            TAG_VERSION="$(printf '%s' "${TAG_APP_JSON}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["expo"]["version"])')"
            TAG_VERSION_CODE="$(printf '%s' "${TAG_APP_JSON}" | python3 -c 'import json,sys; print(json.load(sys.stdin)["expo"]["android"]["versionCode"])')"

            test "${RELEASE_TAG}" = "v${TAG_VERSION}"
            test "${HARNESS_VERSION}" = "${TAG_VERSION}"
            test "${HARNESS_VERSION_CODE}" = "${TAG_VERSION_CODE}"

            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
            fi
          else
            SOURCE_SHA="$(git rev-parse HEAD)"
            TAG_VERSION="${HARNESS_VERSION}"
            TAG_VERSION_CODE="${HARNESS_VERSION_CODE}"
          fi

          echo "FDROID_RELEASE_SOURCE_SHA=${SOURCE_SHA}" >> "${GITHUB_ENV}"
          echo "Release source: ${TAG_VERSION} (${TAG_VERSION_CODE}) at ${SOURCE_SHA}"
      - name: Build unsigned APK through F-Droid production buildserver path
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test -n "${FDROID_RELEASE_SOURCE_SHA:-}"
          bash scripts/fdroid/run-source-build.sh "${FDROID_RELEASE_SOURCE_SHA}" .fdroid.yml

      - name: Upload F-Droid buildserver unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: homelibrary-fdroid-unsigned-${{ matrix.abi }}-${{ github.sha }}
          path: fdroid-buildserver-output/
          if-no-files-found: error
          retention-days: 30

      - name: Upload buildserver diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homelibrary-fdroid-release-build-diagnostics-${{ matrix.abi }}-${{ github.sha }}
          path: fdroid-buildserver-diagnostics/
          if-no-files-found: warn
          retention-days: 30

  sign-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-fdroid-unsigned
    outputs:
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
      release_version: ${{ steps.release-metadata.outputs.release_version }}
      release_version_code: ${{ steps.release-metadata.outputs.release_version_code }}
    env:
      HOMELIBRARY_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      HOMELIBRARY_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      HOMELIBRARY_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}

    steps:
      - name: Check out immutable release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Resolve release metadata
        id: release-metadata
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          RELEASE_TAG=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${REQUESTED_RELEASE_TAG:-}" ]; then
            RELEASE_TAG="${REQUESTED_RELEASE_TAG}"
          fi

          if [ -n "${RELEASE_TAG}" ]; then
            EXPECTED_TAG="v${VERSION}"
            if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
              echo "Release tag ${RELEASE_TAG} does not match app.json version ${EXPECTED_TAG}." >&2
              exit 1
            fi
            TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "Checked-out source ${HEAD_SHA} does not match immutable tag ${RELEASE_TAG} (${TAG_SHA})." >&2
              exit 1
            fi
          fi

          echo "release_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_version_code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "HOMELIBRARY_RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "HOMELIBRARY_RELEASE_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "HOMELIBRARY_RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - name: Download F-Droid buildserver unsigned APK
        uses: actions/download-artifact@v4
        with:
          pattern: homelibrary-fdroid-unsigned-*-${{ github.sha }}
          path: fdroid-buildserver-output

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install F-Droid-compatible APK signing tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${SDK_ROOT}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          test -n "${SDKMANAGER}"
          test -x "${SDKMANAGER}"
          "${SDKMANAGER}" "build-tools;34.0.0" >/dev/null
          APKSIGNER="${SDK_ROOT}/build-tools/34.0.0/apksigner"
          test -x "${APKSIGNER}"
          echo "HOMELIBRARY_APKSIGNER=${APKSIGNER}" >> "${GITHUB_ENV}"

      - name: Validate release signing configuration
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD HOMELIBRARY_RELEASE_KEY_ALIAS HOMELIBRARY_RELEASE_KEY_PASSWORD HOMELIBRARY_RELEASE_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production release signing secret/variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Restore production signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/homelibrary-release-signing"
          KEYSTORE="${RUNNER_TEMP}/homelibrary-release-signing/homelibrary-release.jks"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"
          echo "HOMELIBRARY_RELEASE_KEYSTORE_PATH=${KEYSTORE}" >> "${GITHUB_ENV}"

          ACTUAL="$(keytool -list -v -keystore "${KEYSTORE}" -storepass "${HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD}" -alias "${HOMELIBRARY_RELEASE_KEY_ALIAS}" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "${HOMELIBRARY_RELEASE_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "${ACTUAL}"
          test "${ACTUAL}" = "${EXPECTED}"

      - name: Sign F-Droid buildserver APK
        run: |
          set -euo pipefail
          OUT_DIR="${GITHUB_WORKSPACE}/release"

          mkdir -p "${OUT_DIR}"
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            UNSIGNED="${GITHUB_WORKSPACE}/fdroid-buildserver-output/homelibrary-fdroid-unsigned-${ABI}-${GITHUB_SHA}/app-release-unsigned.apk"
            SIGNED="${OUT_DIR}/HomeLibrary-${HOMELIBRARY_RELEASE_VERSION}-${ABI}.apk"
            cp "$(dirname "${UNSIGNED}")/mapping.txt" "${OUT_DIR}/mapping-${ABI}.txt"
            test -f "${UNSIGNED}"
            sha256sum "${UNSIGNED}" | tee "${OUT_DIR}/unsigned-${ABI}.sha256"

            "${HOMELIBRARY_APKSIGNER}" sign \
              --ks "${HOMELIBRARY_RELEASE_KEYSTORE_PATH}" \
              --ks-key-alias "${HOMELIBRARY_RELEASE_KEY_ALIAS}" \
              --ks-pass env:HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD \
              --key-pass env:HOMELIBRARY_RELEASE_KEY_PASSWORD \
              --out "${SIGNED}" \
              "${UNSIGNED}"

            "${HOMELIBRARY_APKSIGNER}" verify --verbose --print-certs "${SIGNED}" | tee "${OUT_DIR}/apksigner-${ABI}.txt"
            ACTUAL="$(sed -n 's/^.*certificate SHA-256 digest: //p' "${OUT_DIR}/apksigner-${ABI}.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            EXPECTED="$(printf '%s' "${HOMELIBRARY_RELEASE_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            test -n "${ACTUAL}"
            test "${ACTUAL}" = "${EXPECTED}"
            sha256sum "${SIGNED}" | tee "${SIGNED}.sha256"

          done

      - name: Check out release APK scanner tooling
        uses: actions/checkout@v4
        with:
          path: release-scanner-tooling
          ref: ${{ inputs.release_tag && github.sha || github.ref }}

      - name: Install F-Droid APK scanner dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fdroidserver

      - name: Scan signed APK before publication
        run: |
          for ABI in armeabi-v7a arm64-v8a x86 x86_64; do
            bash release-scanner-tooling/scripts/scan-fdroid-apk.sh "${GITHUB_WORKSPACE}/release/HomeLibrary-${HOMELIBRARY_RELEASE_VERSION}-${ABI}.apk"
          done

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: homelibrary-production-release-${{ github.sha }}
          path: |
            release/HomeLibrary-*.apk
            release/HomeLibrary-*.apk.sha256
            release/unsigned-*.sha256
            release/apksigner-*.txt
            release/mapping-*.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable GitHub Release APK
        if: env.HOMELIBRARY_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${HOMELIBRARY_RELEASE_TAG}"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --verify-tag \
              --title "HomeLibrary ${HOMELIBRARY_RELEASE_VERSION}" \
              --generate-notes
          fi

          # Release APK assets are immutable just like release tags. On a recovery
          # run, accept an existing asset only when it is byte-for-byte identical.
          TMP="${RUNNER_TEMP}/existing-release-assets"
          mkdir -p "${TMP}"
          for ASSET in release/HomeLibrary-*.apk release/HomeLibrary-*.apk.sha256 release/unsigned-*.sha256 release/apksigner-*.txt release/mapping-*.txt; do
            NAME="$(basename "${ASSET}")"
            rm -f "${TMP}/${NAME}"
            if gh release download "${TAG}" --pattern "${NAME}" --dir "${TMP}" >/dev/null 2>&1; then
              if ! cmp --silent "${ASSET}" "${TMP}/${NAME}"; then
                echo "Refusing to overwrite an immutable release asset: ${NAME}" >&2
                exit 1
              fi
            else
              gh release upload "${TAG}" "${ASSET}"
            fi
          done

  verify-fdroid-release-parity:
    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:9cb68105642ca4e7b295f0ceab10f069f5b3247dc18fa7c36046e9d81aa469a8
    timeout-minutes: 90
    needs: sign-and-publish
    if: needs.sign-and-publish.outputs.release_tag != ''
    env:
      FDROID_ABI: ${{ matrix.abi }}
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk

    steps:
      - name: Check out parity tooling and canonical metadata
        uses: actions/checkout@v4
        with:
          # Recovery runs must use the fixed workflow/tooling from main while
          # .fdroid.yml still points F-Droid at the immutable release tag.
          ref: ${{ inputs.release_tag && github.sha || needs.sign-and-publish.outputs.release_tag }}

      - name: Verify signed release with F-Droid reference-binary path
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/fdroid/run-release-verification.sh .fdroid.yml

      - name: Upload F-Droid release-parity diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homelibrary-fdroid-release-parity-${{ matrix.abi }}-${{ github.sha }}
          path: fdroid-buildserver-diagnostics/
          if-no-files-found: warn
          retention-days: 30
