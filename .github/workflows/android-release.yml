name: Android release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable vX.Y.Z tag to build and publish; leave blank for a verification-only manual build'
        required: false
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HOMELIBRARY_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
      HOMELIBRARY_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
      HOMELIBRARY_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      # Keep recovery builds on the same proven Gradle/Kotlin memory model as
      # Android reproducibility CI. These workflow-level settings still apply
      # when the immutable release tag is checked out.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g\ -XX:MaxMetaspaceSize=1g\ -Dfile.encoding=UTF-8 -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Resolve release metadata
        env:
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./app.json').expo.version")"
          VERSION_CODE="$(node -p "require('./app.json').expo.android.versionCode")"
          test -n "${VERSION}"
          test -n "${VERSION_CODE}"

          RELEASE_TAG=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${REQUESTED_RELEASE_TAG:-}" ]; then
            RELEASE_TAG="${REQUESTED_RELEASE_TAG}"
          fi

          if [ -n "${RELEASE_TAG}" ]; then
            EXPECTED_TAG="v${VERSION}"
            if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
              echo "Release tag ${RELEASE_TAG} does not match app.json version ${EXPECTED_TAG}." >&2
              exit 1
            fi

            TAG_SHA="$(git rev-list -n 1 "${RELEASE_TAG}")"
            HEAD_SHA="$(git rev-parse HEAD)"
            if [ "${TAG_SHA}" != "${HEAD_SHA}" ]; then
              echo "Checked-out source ${HEAD_SHA} does not match immutable tag ${RELEASE_TAG} (${TAG_SHA})." >&2
              exit 1
            fi
          fi

          echo "HOMELIBRARY_RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "HOMELIBRARY_RELEASE_VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"
          echo "HOMELIBRARY_RELEASE_TAG=${RELEASE_TAG}" >> "${GITHUB_ENV}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install F-Droid-compatible APK signing tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "${SDK_ROOT}"

          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -path '*/bin/sdkmanager' -perm -111 2>/dev/null | sort -V | tail -n 1)"
          fi
          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "Could not locate sdkmanager under ${SDK_ROOT}/cmdline-tools." >&2
            exit 1
          fi

          "${SDKMANAGER}" "build-tools;34.0.0" >/dev/null
          APKSIGNER="${SDK_ROOT}/build-tools/34.0.0/apksigner"
          test -x "${APKSIGNER}"
          echo "HOMELIBRARY_APKSIGNER=${APKSIGNER}" >> "${GITHUB_ENV}"

      - name: Validate release signing configuration
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_RELEASE_KEYSTORE_BASE64 HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD HOMELIBRARY_RELEASE_KEY_ALIAS HOMELIBRARY_RELEASE_KEY_PASSWORD HOMELIBRARY_RELEASE_CERT_SHA256; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required production release signing secret/variable: ${name}" >&2
              exit 1
            fi
          done

      - name: Restore production signing keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/homelibrary-release-signing"
          KEYSTORE="${RUNNER_TEMP}/homelibrary-release-signing/homelibrary-release.jks"
          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE}"
          chmod 600 "${KEYSTORE}"
          echo "HOMELIBRARY_RELEASE_KEYSTORE_PATH=${KEYSTORE}" >> "${GITHUB_ENV}"

          ACTUAL="$(keytool -list -v -keystore "${KEYSTORE}" -storepass "${HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD}" -alias "${HOMELIBRARY_RELEASE_KEY_ALIAS}" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "${HOMELIBRARY_RELEASE_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "Production keystore certificate fingerprint does not match ANDROID_RELEASE_CERT_SHA256." >&2
            exit 1
          fi

      - name: Build canonical unsigned F-Droid APK
        run: bash scripts/build-fdroid-recipe-android.sh

      - name: Sign reproducible APK
        run: |
          set -euo pipefail
          UNSIGNED="${GITHUB_WORKSPACE}/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT_DIR="${GITHUB_WORKSPACE}/release"
          SIGNED="${OUT_DIR}/HomeLibrary-${HOMELIBRARY_RELEASE_VERSION}.apk"
          mkdir -p "${OUT_DIR}"
          test -f "${UNSIGNED}"

          "${HOMELIBRARY_APKSIGNER}" sign \
            --ks "${HOMELIBRARY_RELEASE_KEYSTORE_PATH}" \
            --ks-key-alias "${HOMELIBRARY_RELEASE_KEY_ALIAS}" \
            --ks-pass env:HOMELIBRARY_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:HOMELIBRARY_RELEASE_KEY_PASSWORD \
            --out "${SIGNED}" \
            "${UNSIGNED}"

          "${HOMELIBRARY_APKSIGNER}" verify --verbose --print-certs "${SIGNED}" | tee "${OUT_DIR}/apksigner.txt"
          ACTUAL="$(sed -n 's/^.*certificate SHA-256 digest: //p' "${OUT_DIR}/apksigner.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          EXPECTED="$(printf '%s' "${HOMELIBRARY_RELEASE_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "${ACTUAL}"
          if [ "${ACTUAL}" != "${EXPECTED}" ]; then
            echo "Signed APK certificate fingerprint does not match the pinned production certificate." >&2
            exit 1
          fi
          sha256sum "${SIGNED}" | tee "${SIGNED}.sha256"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: homelibrary-production-release-${{ github.sha }}
          path: |
            release/HomeLibrary-*.apk
            release/HomeLibrary-*.apk.sha256
            release/apksigner.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish immutable GitHub Release APK
        if: env.HOMELIBRARY_RELEASE_TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${HOMELIBRARY_RELEASE_TAG}"
          APK="release/HomeLibrary-${HOMELIBRARY_RELEASE_VERSION}.apk"
          CHECKSUM="${APK}.sha256"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --verify-tag \
              --title "HomeLibrary ${HOMELIBRARY_RELEASE_VERSION}" \
              --generate-notes
          fi

          gh release upload "${TAG}" \
            "${APK}" \
            "${CHECKSUM}" \
            "release/apksigner.txt"
