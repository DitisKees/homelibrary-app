name: Refresh Expo lockfile

on:
  push:
    branches:
      - fix-pocketbase-timestamps
    paths:
      - '.github/workflows/refresh-expo-lock.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix-pocketbase-timestamps

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm

      - name: Refresh Expo patch dependency and lockfile
        run: npm install --package-lock-only --ignore-scripts 'expo@~57.0.21'

      - name: Commit lockfile refresh
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No lockfile changes needed.'
            exit 0
          fi
          git commit -m 'Update Expo patch dependency'
          git push origin HEAD:fix-pocketbase-timestamps
