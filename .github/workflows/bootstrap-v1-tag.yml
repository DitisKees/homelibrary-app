name: Publish v1.0.0 images

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bootstrap-v1-tag.yml'

permissions:
  contents: read
  packages: write

env:
  PB_VERSION: '0.40.1'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v1.0.0
        uses: actions/checkout@v4
        with:
          ref: v1.0.0

      - name: Verify application version
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = '1.0.0'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish backend v1.0.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile
          build-args: |
            PB_VERSION=${{ env.PB_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ditiskees/homelibrary-backend:1.0.0
            ghcr.io/ditiskees/homelibrary-backend:1.0
            ghcr.io/ditiskees/homelibrary-backend:1
            ghcr.io/ditiskees/homelibrary-backend:latest
          cache-from: type=gha,scope=homelibrary-backend
          cache-to: type=gha,mode=max,scope=homelibrary-backend

      - name: Publish web v1.0.0
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/ditiskees/homelibrary-web:1.0.0
            ghcr.io/ditiskees/homelibrary-web:1.0
            ghcr.io/ditiskees/homelibrary-web:1
            ghcr.io/ditiskees/homelibrary-web:latest
          cache-from: type=gha,scope=homelibrary-web
          cache-to: type=gha,mode=max,scope=homelibrary-web
