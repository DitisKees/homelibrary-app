name: F-Droid prebuild parity diagnostic

on:
  push:
    branches:
      - diagnose/fdroid-prebuild-parity
    paths:
      - '.github/workflows/fdroid-prebuild-parity.yml'
      - 'scripts/fdroid/prebuild-parity-check.sh'

concurrency:
  group: fdroid-prebuild-parity-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prebuild-parity:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:9cb68105642ca4e7b295f0ceab10f069f5b3247dc18fa7c36046e9d81aa469a8
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Trace pre-merge DEX inputs
        env:
          DETERMINISTIC_AGP_WORKAROUNDS: "0"
          FULL_BUILD_DIAGNOSTIC: "0"
          AGP_OVERRIDE: ""
          ORDER_TRACE: "0"
          SORT_DIRENTS_PRELOAD: "0"
          RESOURCE_TASK_TRACE: "0"
          RESOURCE_ONLY_DIAGNOSTIC: "0"
          DEX_ONLY_DIAGNOSTIC: "0"
          DEX_INPUT_DIAGNOSTIC: "0"
          MERGE_DEX_TRACE: "1"
          SOURCE_SHA: "182da53ec162df7ff1874e9ddbbba41464a118a2"
          RESOURCE_MAX_WORKERS: "1"
        run: bash scripts/fdroid/prebuild-parity-check.sh

      - name: Upload prebuild manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-prebuild-parity-github
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 7
