name: Focused Glide indexer reproducibility proof
on:
  push:
    branches: [diagnose/fdroid-prebuild-parity]
    paths:
      - scripts/build-glide-ksp-repro.sh
      - scripts/diagnose-glide-indexer.sh
      - .github/workflows/fdroid-prebuild-parity.yml
concurrency:
  group: focused-glide-indexer-proof
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  glide-indexer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.13.1'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install app dependencies
        run: npm ci
      - name: Generate Glide indexer with deterministic processor
        run: bash scripts/diagnose-glide-indexer.sh
      - name: Upload indexer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glide-indexer-evidence
          path: diagnostic-output/glide-indexer/
          if-no-files-found: warn
