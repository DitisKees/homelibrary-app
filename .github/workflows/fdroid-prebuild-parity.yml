name: Expo 58 Android baseline diagnostic

on:
  push:
    branches:
      - diagnose/expo58-reproducibility
    paths:
      - '.github/workflows/fdroid-prebuild-parity.yml'
      - 'package.json'
      - 'app.json'
      - 'tsconfig.json'

concurrency:
  group: expo58-baseline-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  expo58-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'

      - name: Resolve SDK 58 beta dependency set
        run: |
          rm -rf node_modules
          npm install --package-lock=false --ignore-scripts --legacy-peer-deps expo@next
          npm_config_legacy_peer_deps=true npx expo install --fix --npm
          npm_config_legacy_peer_deps=true npx expo install --check

      - name: Report resolved SDK 58 package matrix
        run: |
          node -e "const p=require('./package.json'); console.log(JSON.stringify({dependencies:p.dependencies,devDependencies:p.devDependencies},null,2))"

      - name: Expo Doctor
        run: npm_config_legacy_peer_deps=true npx expo-doctor@latest

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Report generated Android toolchain
        run: |
          echo '=== Gradle wrapper ==='
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo '=== SDK/AGP references ==='
          grep -RInE 'compileSdk|targetSdk|buildTools|com.android.tools.build:gradle|agp' android/gradle.properties android/build.gradle android/settings.gradle android/app/build.gradle 2>/dev/null || true
          echo '=== Expo Image Glide version ==='
          grep -RIn 'GLIDE_VERSION' node_modules/expo-image/android || true
