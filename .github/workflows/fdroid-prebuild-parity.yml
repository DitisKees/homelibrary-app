name: Glide KSP deterministic backport proof
on:
  push:
    branches: [diagnose/fdroid-prebuild-parity]
    paths:
      - scripts/build-glide-ksp-repro.sh
      - .github/workflows/fdroid-prebuild-parity.yml
concurrency:
  group: glide-ksp-backport-proof
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prove-ksp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build minimal patched Glide KSP processor
        run: bash scripts/build-glide-ksp-repro.sh
      - name: Build it again and compare
        run: |
          cp build/repro-tools/glide-ksp-5.0.5-homelibrary-repro1.jar /tmp/first.jar
          bash scripts/build-glide-ksp-repro.sh
          sha256sum /tmp/first.jar build/repro-tools/glide-ksp-5.0.5-homelibrary-repro1.jar
          cmp /tmp/first.jar build/repro-tools/glide-ksp-5.0.5-homelibrary-repro1.jar
          echo glide_ksp_processor_reproducible=true
