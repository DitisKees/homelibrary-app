name: F-Droid prebuild parity diagnostic

on:
  push:
    branches:
      - diagnose/fdroid-prebuild-parity
    paths:
      - '.github/workflows/fdroid-prebuild-parity.yml'
      - 'scripts/fdroid/prebuild-parity-check.sh'

permissions:
  contents: read

jobs:
  prebuild-parity:
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie@sha256:9cb68105642ca4e7b295f0ceab10f069f5b3247dc18fa7c36046e9d81aa469a8
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4

      - name: Probe deterministic filesystem support
        id: disorderfs
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FUSE device/capabilities ==="
          ls -l /dev/fuse || true
          grep '^CapEff:' /proc/self/status || true

          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq disorderfs fuse3

          rm -rf /tmp/disorderfs-under /tmp/disorderfs-view
          mkdir -p /tmp/disorderfs-under /tmp/disorderfs-view
          printf 'c\n' > /tmp/disorderfs-under/c
          printf 'a\n' > /tmp/disorderfs-under/a
          printf 'b\n' > /tmp/disorderfs-under/b

          if disorderfs --sort-dirents=yes --reverse-dirents=no /tmp/disorderfs-under /tmp/disorderfs-view; then
            echo "mounted=true" >> "$GITHUB_OUTPUT"
            python3 - <<'PY'
          import os
          print("dirents=" + ",".join(os.listdir("/tmp/disorderfs-view")))
          PY
            (fusermount3 -u /tmp/disorderfs-view || fusermount -u /tmp/disorderfs-view || umount /tmp/disorderfs-view)
          else
            echo "mounted=false" >> "$GITHUB_OUTPUT"
            echo "[INFO] disorderfs mount is unavailable in this GitHub container."
          fi

      - name: Generate prebuild manifest
        if: steps.disorderfs.outputs.mounted == 'true'
        env:
          USE_DISORDERFS: "1"
          AGP_OVERRIDE: ""
        run: bash scripts/fdroid/prebuild-parity-check.sh

      - name: Upload prebuild manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdroid-prebuild-parity-github
          path: diagnostic-output/
          if-no-files-found: error
          retention-days: 7
