Changelog: https://github.com/DitisKees/homelibrary-app/tags

RepoType: git
Repo: https://github.com/DitisKees/homelibrary-app.git
Binaries: https://github.com/DitisKees/homelibrary-app/releases/download/v%v/HomeLibrary-%v.apk

Builds:
  - versionName: 1.0.4
    versionCode: 5
    commit: v1.0.4
    ndk: r27b
    sudo:
      - apt-get update
      - apt-get install -y curl xz-utils
      - curl -fsSL https://nodejs.org/dist/v22.13.1/node-v22.13.1-linux-x64.tar.xz -o /tmp/node-v22.13.1-linux-x64.tar.xz
      - echo '0d2a5af33c7deab5555c8309cd3f373446fe1526c1b95833935ab3f019733b3b  /tmp/node-v22.13.1-linux-x64.tar.xz' | sha256sum -c -
      - tar -xJf /tmp/node-v22.13.1-linux-x64.tar.xz -C /usr/local --strip-components=1
    init:
      - node --version
      - npm --version
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - node_modules
    build:
      - bash scripts/build-fdroid-recipe-android.sh

MaintainerNotes: |-
  HomeLibrary uses Expo/React Native and does not commit android/; Expo prebuild
  creates the Android project during the build, so this recipe intentionally has
  no subdir entry.

  Native React Native/Expo builds can embed absolute checkout paths and varying
  GNU build IDs in source-built ELF libraries. The shared recipe-compatible build
  applies compiler prefix maps and normalizes only the GNU SHA-1 build-id note
  in-place in stored native-library APK entries, refreshing ZIP CRCs without
  changing offsets, timestamps, alignment or compression. Upstream CI builds two
  independent checkouts and requires the unsigned APKs to match byte-for-byte.

  Expo SDK 57 bundles precompiled AARs in local-maven-repo directories. Upstream
  configures Expo autolinking buildFromSource [".*"] and the build script deletes
  every bundled local-maven-repo so native Expo modules are compiled from source.

  node_modules is scanignored rather than scandeleted because the React Native /
  Expo source tree is required to compile the application. Upstream separately
  audits production npm licenses/provenance and removes the bundled Expo AARs
  before Android generation. During build, the generated release dependency graph
  is checked for Google Play Services, Firebase, ML Kit and Play SDK artifacts.

  Expo SDK 57 requires Node.js 22.13.x or newer. Debian trixie's Node.js is too
  old for this SDK, so the recipe installs the checksum-pinned official Node.js
  22.13.1 build tool before running the shared build script. Node.js itself is not
  bundled in the APK.

  React Native 0.86 is built with the Expo SDK 57 NDK baseline, pinned here as
  Android NDK r27b instead of relying on the buildserver's ambient NDK.

  This upstream development copy refers to the intended immutable v1.0.4 tag.\n  The fdroiddata submission should use the tag's full Git commit hash once the\n  release tag has been created.\n
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
UpdateCheckData: 'app.json|"versionCode":\s*(\d+)|app.json|"version":\s*"([\d.]+)"'
CurrentVersion: 1.0.4
CurrentVersionCode: 5
