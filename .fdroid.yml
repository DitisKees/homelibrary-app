MaintainerNotes: |
  Expo generates android/ during prebuild, so no subdir is declared.
  Bundled Expo AARs are removed and native modules are built from source.
  The React Native Java 17 toolchain declarations are adjusted to the
  buildserver JDK 21. Glide KSP also builds on JDK 21, targeting Java 11.

  Glide 5.0.5 KSP has nondeterministic module ordering. The commit-pinned
  Glide srclib supplies annotation and processor sources, copied into
  build/glide-source before scanning. The processor-only Gradle project
  avoids unrelated samples and publishing plugins. The one-line ordering
  backport is applied before scanning; compilation uses buildserver Gradle.
  Only the processor JAR is replaced in build/repro-maven; its
  checked-in upstream POM retains the original transitive dependencies.
  The runtime Glide dependency is unchanged.

  Reviewed React Native Gradle files use scanignore to preserve their
  legacy Maven declarations from scanner rewriting. The upstream Expo
  plugin fixes the dev-server resource to localhost, maps native source
  paths and disables dependency metadata. Native build IDs are normalized
  by the checked-in helper. Resource shrinking stays disabled for
  reproducibility.

  app.json stores the base versionCode. VercodeOperation expands it for
  the four standalone ABIs; per-build binary URLs preserve ABI identity.

  Forky remains the Debian Node source. nodejs/libnode137 24.22.2 and npm
  12.2.0 are exact package pins; the required Forky dependency allowlist is
  rendered from scripts/fdroid/debian-toolchain.lock. All other Forky packages
  have negative priority. libc6 2.43 is required by Debian libnode137; this
  is an explicit runtime dependency, not a general testing upgrade. Missing
  pinned versions fail apt rather than selecting a newer toolchain.

  The reviewed Glide init script needs scanignore for its dynamic local
  Maven URL. exclusiveContent limits it to the rebuilt KSP coordinate, and
  homeLibraryGlideKspResolution verifies the actual resolved artifact.
  Gradle checks declared Glide versions before processor compilation.
  Targeted scandelete paths cover unused Apple/Windows/WASM tools and
  generated Gradle outputs identified in the successful four-ABI build log.
  New paths outside this list fail the normal source scanner.

