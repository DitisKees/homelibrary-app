AntiFeatures:
  NonFreeNet:
    en-US: ISBN metadata lookup optionally uses Google Books, a proprietary network
      service. It is disabled by default and can be enabled in Settings. An optional
      API key makes Google Books the first provider when enabled.
Categories:
  - Inventory
  - Reading
License: GPL-3.0-or-later
AuthorName: Kees van 't Slot
SourceCode: https://github.com/DitisKees/homelibrary-app
IssueTracker: https://github.com/DitisKees/homelibrary-app/issues
Changelog: https://github.com/DitisKees/homelibrary-app/tags

RepoType: git
Repo: https://github.com/DitisKees/homelibrary-app.git

Builds:
  - versionName: 1.0.13
    versionCode: 141
    commit: v1.0.13
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - "printf 'Package: *\\nPin: release n=forky\\nPin-Priority: -1\\n' > /etc/apt/preferences.d/homelibrary-forky"
      - "for pin in eslint=6.4.0~dfsg+~6.1.9-14 libada-url0-3=3.4.4-1+b1 libc-bin=2.43-7
        libc-dev-bin=2.43-7 libc-gconv-modules-extra=2.43-7 libc6=2.43-7 libc6-dev=2.43-7
        libc6-i386=2.43-7 libc6-x32=2.43-7 libhdr-histogram6=0.11.8-4+b2 libicu78=78.3-2
        libllhttp9.4=9.4.3+~cs12.11.9-2 libnode-dev=24.22.2+dfsg+~cs24.19.2-1 libnode137=24.22.2+dfsg+~cs24.19.2-1
        libsimdjson33=4.6.11-1 libsimdutf35=9.3.0+really9.1.2-1 libuv1-dev=1.53.0-1
        libuv1t64=1.53.0-1 node-acorn=8.17.0+ds+~cs28.27.25-1 node-babel-helper-define-polyfill-provider=1.0.0~20260618+ds1-4
        node-babel-plugin-polyfill-corejs3=1.0.0~20260618+ds1-4 node-babel7=8.1.1+ds1+~cs177.303.116-1
        node-babel7-runtime=8.1.1+ds1+~cs177.303.116-1 node-cacache=20.0.4+~cs30.1.8-3
        node-chokidar=4.0.3+~cs4.1.2-4 node-chownr=3.0.0-5 node-ci-info=4.4.0+~cs8.2.0-4
        node-commander=14.0.3-7 node-convert-source-map=2.0.0+~2.0.3-4 node-copy-concurrently=1.0.5-13
        node-cspotcode-source-map-support=0.8.1+ds-3 node-css-loader=6.11.0+~cs15.5.7-3
        node-del=7.1.0-2 node-empathic=2.0.1-2 node-env-paths=3.0.0-3 node-envinfo=7.11.0+~cs14.3.0-9
        node-eslint-visitor-keys=3.3.0+ds1-3 node-fdir=6.5.0-2 node-file-entry-cache=6.0.1+~3.0.4+~2.0.0+~1.0.0+~2.0.1-6
        node-find-cache-dir=3.3.2+~3.2.1-1 node-flat-cache=3.0.4~6.0.1+~3.0.4+~2.0.0+~1.0.0+~2.0.1-6
        node-glob=13.0.6+~cs0.4.15-2 node-gyp=13.1.0+~7.0.0-1 node-import-local=3.2.0+~cs2.0.3-3
        node-import-meta-resolve=4.2.0-2 node-istanbul=0.4.5+repack10+~cs98.25.59-13
        node-jest-worker=29.6.2~ds7+~cs73.45.28-8 node-lru-cache=11.2.7-7 node-minipass=7.1.3+~cs21.1.8-4
        node-move-concurrently=1.0.1-8 node-npm-package-arg=13.0.2+~6.1.0-6 node-obug=2.1.4-3
        node-promzard=3.0.1-4 node-read=5.0.1-4 node-read-package-json=5.0.2+~2.0.0-6
        node-read-pkg=10.1.0+~5.10.0-1 node-regenerate-unicode-properties=10.2.2+ds-4
        node-regexpu-core=6.4.0-1 node-resolve-import=2.4.0+~4.0.0-4 node-rimraf=6.1.3-2
        node-slash=5.1.0-2 node-supports-color=10.2.2+ds-3 node-tapable=2.3.3-1 node-tape=5.6.1+~cs8.20.19-6
        node-tar=7.5.22+~4.0.1-1 node-terser=5.51.2-2 node-verkit=0.5.0-1 node-watchpack=2.5.2-4
        node-write=2.0.0~6.0.1+~3.0.4+~2.0.0+~1.0.0+~2.0.1-6 node-yallist=5.0.0-4
        nodejs=24.22.2+dfsg+~cs24.19.2-1 npm=12.2.0+ds1-1 terser=5.51.2-2 webpack=5.108.0+dfsg1+~cs14.7.20-3;
        do printf '\\nPackage: %s\\nPin: version %s\\nPin-Priority: 1001\\n' \"${pin%%=*}\"\
        \ \"${pin#*=}\" >> /etc/apt/preferences.d/homelibrary-forky; done"
      - apt-get -o Acquire::Retries=3 update
      - apt-get -o Acquire::Retries=3 install --no-install-recommends -y nodejs=24.22.2+dfsg+~cs24.19.2-1
        libnode137=24.22.2+dfsg+~cs24.19.2-1 npm=12.2.0+ds1-1
      - test "$(dpkg-query -W -f='${Version}' nodejs)" = '24.22.2+dfsg+~cs24.19.2-1'
      - test "$(dpkg-query -W -f='${Version}' npm)" = '12.2.0+ds1-1'
    init:
      - node --version
      - npm --version
      - dpkg-query -W nodejs libnode137 npm
      - npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    binary: 
      https://github.com/DitisKees/homelibrary-app/releases/download/v%v/HomeLibrary-%v-armeabi-v7a.apk
    srclibs:
      - Glide@ebbf7e2680e0a5812bdb428034aa38fb9260dba7
    prebuild:
      - bash scripts/prepare-glide-ksp-source.sh $$Glide$$
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - npx expo prebuild -p android --clean
      - bash scripts/prepare-android-gradle-properties.sh
      - echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
        >> android/gradle.properties
      - echo 'org.gradle.workers.max=2' >> android/gradle.properties
      - echo 'kotlin.compiler.execution.strategy=in-process' >> android/gradle.properties
      - bash scripts/prepare-android-gradle-properties.sh
      - bash scripts/check-fdroid-android-dependencies.sh
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
      - scripts/glide-ksp-repro.init.gradle
    scandelete:
      - node_modules/@expo/expo-modules-macros-plugin/apple/ExpoModulesMacros-tool
      - node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/build
      - node_modules/@react-native/gradle-plugin/settings-plugin/build
      - node_modules/@react-native/gradle-plugin/shared/build
      - node_modules/expo-camera/prebuilds
      - node_modules/expo-file-system/prebuilds
      - node_modules/expo-font/prebuilds
      - node_modules/expo-image-manipulator/prebuilds
      - node_modules/expo-image/prebuilds
      - node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-plugin-shared/build
      - node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-plugin/build
      - node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-autolinking-settings-plugin/build
      - node_modules/expo-modules-autolinking/android/expo-gradle-plugin/expo-max-sdk-override-plugin/build
      - node_modules/expo-modules-core/expo-module-gradle-plugin/build
      - node_modules/expo-modules-core/prebuilds
      - node_modules/expo/template.tgz
      - node_modules/fb-dotslash/bin/linux-musl.aarch64/dotslash
      - node_modules/fb-dotslash/bin/linux-musl.x86_64/dotslash
      - node_modules/fb-dotslash/bin/macos/dotslash
      - node_modules/fb-dotslash/bin/windows-arm64/dotslash.exe
      - node_modules/fb-dotslash/bin/windows/dotslash.exe
      - node_modules/hermes-compiler/hermesc/osx-bin/hermesc
      - node_modules/hermes-compiler/hermesc/win64-bin/hermesc.exe
      - node_modules/react-native/React/I18n/strings/*/fbt_language_pack.bin
      - node_modules/react-native/ReactAndroid/publish.gradle
      - node_modules/zxing-wasm/dist/full/zxing_full.wasm
      - node_modules/zxing-wasm/dist/reader/zxing_reader.wasm
      - node_modules/zxing-wasm/dist/writer/zxing_writer.wasm
    build:
      - bash scripts/build-glide-ksp-repro.sh
      - cd android/app
      - gradle -I ../../scripts/glide-ksp-repro.init.gradle homeLibraryGlideKspResolution
        assembleRelease -PreactNativeArchitectures=armeabi-v7a
    ndk: r27b
    postbuild:
      - python3 scripts/normalize-fdroid-apk-build-ids.py android/app/build/outputs/apk/release/app-release-unsigned.apk
      - bash scripts/verify-fdroid-apk.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
      - bash scripts/verify-android-abi-apk.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
        armeabi-v7a
      - test -s android/app/build/outputs/mapping/release/mapping.txt

