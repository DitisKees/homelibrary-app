RepoType: git
Repo: https://github.com/DitisKees/homelibrary-app.git
Binaries: https://github.com/DitisKees/homelibrary-app/releases/download/v%v/HomeLibrary-%v.apk

Builds:
  - versionName: 1.0.7
    versionCode: 8
    commit: v1.0.7
    subdir: android/app
    ndk: r27b
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get update
      - apt-get install -y -t forky npm
    init:
      - cd ../..
      - node --version
      - npm --version
      - npm ci
    gradle:
      - yes
    prebuild:
      - cd ../..
      - sed -i -e 's/"node":\ ">=22.13.0 <23"/"node":\ ">=22.13.0"/' package.json
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
      - npx expo prebuild -p android --clean
      - bash scripts/prepare-android-gradle-properties.sh
      - |-
        cat >> android/gradle.properties <<'EOF'
        org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
        org.gradle.workers.max=2
        kotlin.compiler.execution.strategy=in-process
        EOF
      - bash scripts/prepare-android-gradle-properties.sh
      - bash scripts/check-fdroid-android-dependencies.sh
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    postbuild:
      - cd ../..
      - python3 scripts/normalize-fdroid-apk-build-ids.py android/app/build/outputs/apk/release/app-release-unsigned.apk
      - bash scripts/verify-fdroid-apk.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
    scanignore:
      - node_modules/react-native/sdks/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/expo-modules-autolinking/scripts/android/autolinking_implementation.gradle
    scandelete:
      - node_modules

