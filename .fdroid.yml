MaintainerNotes: |-
  HomeLibrary uses Expo/React Native and does not commit android/. The recipe
  follows templates/build-react-native.yml: npm dependencies are installed during
  init, Expo prebuild generates the Android project, signingConfig is removed,
  and F-Droid invokes Gradle directly.

  Node.js/npm are installed from Debian forky as requested by the F-Droid
  maintainer. Forky currently provides a newer Node.js than the source tag's
  conservative <23 engines upper bound, so the recipe removes only that upper
  bound before npm install/prebuild.

  Expo SDK 57 bundles precompiled AARs in local-maven-repo directories. Expo
  autolinking is configured upstream to build all native modules from source and
  bundled local Maven repositories are removed before Android generation.

  Native React Native/Expo builds can embed absolute checkout paths and varying
  GNU build IDs in source-built ELF libraries. The upstream Expo config plugin
  plugins/with-reproducible-native-builds.js configures externalNativeBuild CMake
  prefix maps. APK build-id normalization is implemented in the checked-in
  scripts/normalize-fdroid-apk-build-ids.py helper rather than embedded metadata.

  React Native 0.86 is built with the Expo SDK 57 NDK baseline, pinned here as
  Android NDK r27b.

  The 1.0.7 follow-up fixes a release-build regression where Gradle memory
  settings could be concatenated onto Expo Camera's generated
  expo.camera.barcode-scanner-enabled=false property. That accidentally enabled
  Google ML Kit barcode artifacts in 1.0.5/1.0.6 upstream APKs despite the source
  configuration requesting the local ZXing path. The recipe now guards the
  generated property before and after appending settings, audits the final
  dependency graph, and rejects ML Kit/Barhopper artifacts in the built APK.

  This upstream development copy refers to the intended immutable v1.0.7 tag.
  The fdroiddata submission should use the tag's full Git commit hash once the
  release tag has been created.

