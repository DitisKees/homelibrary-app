AntiFeatures:
  NonFreeNet:
    en-US: ISBN metadata lookup optionally uses Google Books, a proprietary network
      service. It is disabled by default and can be enabled in Settings. An optional
      API key makes Google Books the first provider when enabled.
Categories:
  - Inventory
  - Reading
License: GPL-3.0-or-later
AuthorName: Kees van 't Slot
SourceCode: https://github.com/DitisKees/homelibrary-app
IssueTracker: https://github.com/DitisKees/homelibrary-app/issues
Changelog: https://github.com/DitisKees/homelibrary-app/tags

RepoType: git
Repo: https://github.com/DitisKees/homelibrary-app.git

Builds:
  - versionName: 1.0.12
    versionCode: 131
    commit: v1.0.12
    sudo:
      - echo "deb https://deb.debian.org/debian forky main" > /etc/apt/sources.list.d/forky.list
      - apt-get -o Acquire::Retries=3 update
      - apt-get -o Acquire::Retries=3 install -y -t forky npm
      - install -d -o vagrant -g vagrant /usr/share/maven-repo/com/github/bumptech/glide/ksp/5.0.5
    init:
      - node --version
      - npm --version
      - sed -i -e 's/"node":\ ">=22.13.0 <23"/"node":\ ">=22.13.0"/' package.json
      - npm ci
    output: android/app/build/outputs/apk/release/app-release-unsigned.apk
    binary: 
      https://github.com/DitisKees/homelibrary-app/releases/download/v%v/HomeLibrary-%v-armeabi-v7a.apk
    srclibs:
      - Glide@ebbf7e2680e0a5812bdb428034aa38fb9260dba7
    prebuild:
      - bash scripts/prepare-glide-ksp-source.sh $$Glide$$
      - find node_modules -type d -name local-maven-repo -prune -exec rm -rf {} +
      - sed -i '/jvmToolchain\|JavaVersion/s/17/21/' node_modules/@react-native/gradle-plugin/*/build.gradle.kts
        node_modules/@react-native/gradle-plugin/react-native-gradle-plugin/src/main/kotlin/com/facebook/react/utils/JdkConfiguratorUtils.kt
      - npx expo prebuild -p android --clean
      - bash scripts/prepare-android-gradle-properties.sh
      - echo 'org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8'
        >> android/gradle.properties
      - echo 'org.gradle.workers.max=2' >> android/gradle.properties
      - echo 'kotlin.compiler.execution.strategy=in-process' >> android/gradle.properties
      - bash scripts/prepare-android-gradle-properties.sh
      - bash scripts/check-fdroid-android-dependencies.sh
      - sed -i -e '/signingConfig /d' android/app/build.gradle
    scanignore:
      - node_modules/hermes-compiler/hermesc/linux64-bin/hermesc
      - node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle
      - node_modules/@react-native-async-storage/async-storage/android/build.gradle
      - node_modules/react-native-safe-area-context/android/build.gradle
      - node_modules/react-native-screens/android/build.gradle
    scandelete:
      - node_modules
    build:
      - bash scripts/build-glide-ksp-repro.sh
      - cp build/repro-maven/com/github/bumptech/glide/ksp/5.0.5/* /usr/share/maven-repo/com/github/bumptech/glide/ksp/5.0.5/
      - cd android/app
      - gradle -I ../../scripts/glide-ksp-repro.init.gradle assembleRelease -PreactNativeArchitectures=armeabi-v7a
    ndk: r27b
    postbuild:
      - python3 scripts/normalize-fdroid-apk-build-ids.py android/app/build/outputs/apk/release/app-release-unsigned.apk
      - bash scripts/verify-fdroid-apk.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
      - bash scripts/verify-android-abi-apk.sh android/app/build/outputs/apk/release/app-release-unsigned.apk
        armeabi-v7a
      - test -s android/app/build/outputs/mapping/release/mapping.txt

