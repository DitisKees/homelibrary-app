MaintainerNotes: |
  HomeLibrary uses Expo/React Native and does not commit android/. Expo prebuild
  therefore generates the Android project after checkout. Because fdroidserver
  validates subdir before init/prebuild, no subdir is declared; output points to
  the generated APK and the build command runs Gradle from android/app.

  Node.js/npm are installed from Debian forky as requested by the F-Droid
  maintainer. The conservative upstream Node <23 engine ceiling is relaxed
  before npm ci because current forky supplies Node 24. The React Native Gradle
  plugin still declares a Java 17 toolchain,
  while the current F-Droid build image supplies Java 21. The prebuild applies
  the same 17-to-21 toolchain adjustment used by F-Droid's React Native template.

  Expo SDK 57 bundles precompiled AARs in local-maven-repo directories. Expo
  autolinking is configured upstream to build all native modules from source and
  bundled local Maven repositories are removed before Android generation.

  F-Droid's scanner recognizes legacy/relative Maven repository declarations in
  several React Native module Gradle files as unknown repositories and rewrites
  those files. Existing accepted React Native recipes preserve those reviewed
  Gradle files with scanignore; HomeLibrary does the same for AsyncStorage,
  Safe Area Context, and Screens.

  Native React Native/Expo builds can embed absolute checkout paths and varying
  GNU build IDs in source-built ELF libraries. The checked-in upstream Expo
  config plugin adds app-level externalNativeBuild C/C++ prefix-map flags during
  Expo prebuild. APK build-id normalization is implemented by the checked-in
  scripts/normalize-fdroid-apk-build-ids.py helper.

  React Native 0.86 is built with the Expo SDK 57 NDK baseline, pinned here as
  Android NDK r27b.

  Version 1.0.7 fixed a release-build regression where release Gradle settings
  could be concatenated onto Expo Camera's generated
  expo.camera.barcode-scanner-enabled=false property. The recipe normalizes and
  validates that property, audits the release dependency graph, and rejects
  ML Kit/Barhopper artifacts in the built APK.

  Version 1.0.8 is a build-system release that makes the F-Droid buildserver
  path authoritative for the unsigned production APK. Upstream CI builds the
  candidate in the same buildserver image, verifies independent buildserver
  reproducibility, and performs F-Droid's signed-reference comparison after
  publication before fdroiddata is updated.

    Release 1.0.11 enables R8 upstream. Each ABI is a standalone APK built with
    reactNativeArchitectures, using versionCode 10 * base + ABI (1 through 4).
    Per-build binary URLs preserve ABI identity when auto-updates copy builds.
    app.json stores the base code; VercodeOperation expands all four updates.
    Resource shrinking remains disabled for reproducibility.

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9]+\.[0-9]+\.[0-9]+$
VercodeOperation:
  - 10 * %c + 1
  - 10 * %c + 2
  - 10 * %c + 3
  - 10 * %c + 4
UpdateCheckData: app.json|"versionCode":\s*(\d+)|app.json|"version":\s*"([\d.]+)"
