// Expo Image still declares 5.0.5. Glide 5.0.8 restored deterministic module
// sorting in KSP; use the official 5.0.9 artifacts for the complete Glide graph.
// Remove this compatibility rule when upgrading to a fixed Expo dependency.
def glideGroup = 'com.github.bumptech.glide'
def expoGlideVersion = '5.0.5'
def fixedGlideVersion = '5.0.9'
def expoModules = ['glide', 'ksp', 'avif-integration', 'okhttp3-integration'] as Set

allprojects {
    configurations.configureEach { configuration ->
        resolutionStrategy.eachDependency { details ->
            // Only replace the obsolete Expo version. Other requests (including
            // older transitive Glide 4.x dependencies) must participate in
            // Gradle's normal conflict resolution. Validate the selected graph,
            // not every incoming version selector.
            if (details.requested.group == glideGroup &&
                    details.requested.version == expoGlideVersion) {
                details.useVersion(fixedGlideVersion)
                details.because('Glide annotation processors must generate deterministic module order')
            }
        }
    }
}

// The graph must be resolved in a task owned by the configuration's project.
// Gradle 9 rejects cross-project configuration resolution at task execution.
def verifyGraph = { configuration, required ->
    def graph = configuration.incoming.resolutionResult
    def unresolved = graph.allDependencies.findAll {
        it instanceof org.gradle.api.artifacts.result.UnresolvedDependencyResult
    }
    if (!unresolved.empty) {
        throw new GradleException("Unresolved ${configuration.name} dependencies: " +
            unresolved.collect { "${it.from.id} -> ${it.attempted}: ${it.failure.message}" }.join("\n"))
    }
    def modules = graph.allComponents.collect { it.id }.findAll {
        it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
            it.group == glideGroup
    }
    if (!modules*.module.containsAll(required) ||
            modules.any { it.version != fixedGlideVersion }) {
        throw new GradleException("Unexpected Glide graph on ${configuration.name}: ${modules}")
    }
    println("HOMELIBRARY_GLIDE_GRAPH ${configuration.name}: ${modules.sort { it.module }}")
}

project(':app') { app ->
    app.tasks.register('homeLibraryVerifyGlideRuntime') {
        group = 'verification'
        description = 'Verify official Glide runtime dependency resolution'
        doLast {
            verifyGraph(app.configurations.getByName('releaseRuntimeClasspath'),
                ['glide', 'avif-integration', 'okhttp3-integration'])
        }
    }
}

project(':expo-image') { expoImage ->
    expoImage.tasks.register('homeLibraryVerifyGlideKsp') {
        group = 'verification'
        description = 'Verify declared Expo Image Glide versions and resolved KSP processor'
        doLast {
            def declared = expoImage.configurations.collectMany { it.dependencies.toList() }
                .findAll { it.group == glideGroup }
            if (declared.collect { it.name }.toSet() != expoModules ||
                    declared.any { it.version != expoGlideVersion }) {
                throw new GradleException("Expo Image Glide declarations changed: ${declared}. Review or remove the override.")
            }
            def processor = expoImage.configurations.getByName('kspReleaseKotlinProcessorClasspath')
            verifyGraph(processor, ['ksp'])
            def ksp = processor.incoming.artifactView {
                componentFilter { id ->
                    id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                        id.group == glideGroup && id.module == 'ksp'
                }
            }.artifacts.artifacts
            if (ksp.size() != 1 || ksp.first().file.name != "ksp-${fixedGlideVersion}.jar") {
                throw new GradleException("Expected the official Glide KSP JAR, found: ${ksp}")
            }
            println("HOMELIBRARY_GLIDE_KSP=${ksp.first().file.name}")
        }
    }
}
