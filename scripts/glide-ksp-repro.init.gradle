// HomeLibrary reproducibility backport for Glide 5.0.5 KSP.
// Applied explicitly with: ./gradlew -I ../scripts/glide-ksp-repro.init.gradle <task>
//
// KSP creates kspReleaseKotlinProcessorClasspath as the resolvable processor
// classpath. Keep Expo's stock dependency graph, but replace only the Glide
// processor artifact on that derived classpath.

def homeLibraryRoot = initscript.sourceFile.parentFile.parentFile
def patchedJar = new File(homeLibraryRoot,
    "build/repro-tools/glide-ksp-5.0.5-homelibrary-repro1.normalized.jar")

if (!patchedJar.isFile()) {
    throw new GradleException("Patched Glide KSP processor missing: " + patchedJar)
}

gradle.afterProject { project ->
    if (project.path != ":expo-image") {
        return
    }

    def cfg = project.configurations.findByName("kspReleaseKotlinProcessorClasspath")
    if (cfg == null) {
        throw new GradleException(
            "Expected KSP processor classpath kspReleaseKotlinProcessorClasspath was not created"
        )
    }

    // Remove only the stock Glide processor module from the derived processor
    // classpath. Its transitive dependencies remain available through the
    // original KSP dependency graph.
    cfg.exclude(group: "com.github.bumptech.glide", module: "ksp")
    project.dependencies.add(cfg.name, project.files(patchedJar))

    project.tasks.register("homeLibraryGlideKspResolution") {
        doLast {
            def files = cfg.files
            def patched = files.findAll { it.canonicalFile == patchedJar.canonicalFile }
            if (patched.size() != 1) {
                throw new GradleException(
                    "Expected patched Glide processor exactly once, found " + patched.size()
                )
            }
            def stock = files.findAll {
                it.name == "ksp-5.0.5.jar" &&
                it.canonicalFile != patchedJar.canonicalFile
            }
            if (!stock.empty) {
                throw new GradleException("Stock Glide ksp-5.0.5.jar still present: " + stock)
            }
            println("HOMELIBRARY_KSP_CLASSPATH=" + cfg.name)
            println("HOMELIBRARY_KSP_PATCHED=" + patchedJar.canonicalPath)
            println("HOMELIBRARY_KSP_FILE_COUNT=" + files.size())
        }
    }
}
