// HomeLibrary reproducibility backport for Glide 5.0.5 KSP.
// Applied explicitly with: ./gradlew -I ../scripts/glide-ksp-repro.init.gradle <task>
//
// This does not modify Expo or node_modules. It redirects exactly one pinned
// processor dependency and fails if the local backport repository is absent.

def homeLibraryRoot = initscript.sourceFile.parentFile.parentFile
def repoDir = new File(homeLibraryRoot, "build/repro-maven")
if (!repoDir.isDirectory()) {
    throw new GradleException("HomeLibrary Glide KSP backport repository missing: " + repoDir)
}

gradle.beforeProject { project ->
    project.repositories {
        maven {
            name = "homeLibraryGlideKspRepro"
            url = repoDir.toURI()
            content {
                includeVersion("com.github.bumptech.glide", "ksp", "5.0.5-homelibrary-repro1")
            }
        }
    }

    project.configurations.configureEach { configuration ->
        configuration.resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "com.github.bumptech.glide" &&
                details.requested.name == "ksp" &&
                details.requested.version == "5.0.5") {
                details.useVersion("5.0.5-homelibrary-repro1")
                details.because("Backport Glide deterministic LibraryGlideModule ordering for reproducible builds")
            }
        }
    }
}


// Diagnostic task: resolve only configurations that actually inherit a Glide KSP declaration.
gradle.afterProject { project ->
    if (project.path == ":expo-image") {
        project.tasks.register("homeLibraryGlideKspResolution") {
            doLast {
                def candidates = project.configurations.findAll { cfg ->
                    cfg.canBeResolved && cfg.allDependencies.any { dep ->
                        dep.group == "com.github.bumptech.glide" && dep.name == "ksp"
                    }
                }
                if (candidates.empty) {
                    throw new GradleException("No resolvable expo-image configuration inherits the Glide KSP dependency")
                }
                candidates.each { cfg ->
                    println("HOMELIBRARY_KSP_CONFIGURATION=" + cfg.name)
                    def artifacts = cfg.resolvedConfiguration.resolvedArtifacts.findAll {
                        it.moduleVersion.id.group == "com.github.bumptech.glide" && it.name == "ksp"
                    }
                    artifacts.each { artifact ->
                        println("HOMELIBRARY_KSP_RESOLVED=" + artifact.moduleVersion.id)
                        println("HOMELIBRARY_KSP_FILE=" + artifact.file)
                    }
                }
            }
        }
    }
}
